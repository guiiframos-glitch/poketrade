<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéTrade — Marketplace de Cartas Pokémon</title>
<style>
  :root{
    --bg:#0A0D13; --bg-soft:#0F1420; --surface:#141A26; --surface-2:#1A2233;
    --line:#26304680; --line-solid:#2A3448;
    --text:#E7ECF7; --text-dim:#8B96AD; --text-faint:#5C6680;
    --red:#E3402A; --red-dark:#B22E1C; --red-glow:#FF5B40;
    --yellow:#F5C324; --yellow-glow:#FFD84D;
    --teal:#22B8A6; --teal-dark:#178F82; --teal-glow:#3DDFCB;
    --green:#3BC46A; --green-dark:#289450;
    --gold:#D9B34D; --gold-glow:#F0CE6E;
    --blue:#4C8DFF;
    --muted:#8B96AD;
    --display: 'Helvetica Neue', Arial, sans-serif;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: 'Courier New', Courier, monospace;
    --radius: 4px;
    --radius-lg: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px;
    background-attachment: fixed;
  }
  h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-.2px;}
  p{margin:0;}
  button{font-family:var(--sans); cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1200px;margin:0 auto;padding:0 28px;}
  ::selection{background:var(--red);color:#fff;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:bold;}

  /* NAVBAR */
  #topstrip{height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 30%,var(--yellow) 30%,var(--yellow) 55%,var(--teal) 55%,var(--teal) 100%);}
  #navbar{position:sticky;top:0;z-index:50;background:rgba(10,13,19,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-solid);}
  .indicator-lights{display:flex;gap:5px;align-items:center;margin-right:2px;}
  .indicator-lights span{width:6px;height:6px;border-radius:50%;display:block;}
  .indicator-lights .l1{background:var(--red);box-shadow:0 0 4px var(--red);}
  .indicator-lights .l2{background:var(--yellow);box-shadow:0 0 4px var(--yellow);}
  .indicator-lights .l3{background:var(--teal);box-shadow:0 0 4px var(--teal);}
  #navbar .bar{display:flex;align-items:center;gap:26px;height:64px;}
  .logo-mark{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-emblem{width:26px;height:26px;flex-shrink:0;}
  .logo-mark .logo-text{font-family:var(--display);font-weight:800;font-size:18px;color:var(--text);letter-spacing:.5px;white-space:nowrap;}
  .logo-mark .logo-text .accent{color:var(--red);}
  #navbar nav{display:flex;gap:4px;flex:1;}
  #navbar nav a{font-family:var(--mono);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);padding:9px 13px;border-radius:4px;font-weight:bold;border:1px solid transparent;}
  #navbar nav a.active{color:var(--yellow);background:#1D2333;border-color:var(--line-solid);}
  #navbar nav a:hover{color:var(--text);}
  #navbar .search{flex:1;max-width:300px;position:relative;}
  #navbar .search:before{content:'>';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--teal);font-family:var(--mono);font-size:13px;}
  #navbar .search input{width:100%;padding:8px 13px 8px 26px;border-radius:4px;border:1px solid var(--line-solid);background:var(--surface);color:var(--text);font-size:12.5px;font-family:var(--mono);}
  #navbar .search input::placeholder{color:var(--text-faint);}
  #navbar .search input:focus{outline:none;border-color:var(--teal);}
  #navbar .right{display:flex;align-items:center;gap:10px;}
  #navbar .icon-btn{width:34px;height:34px;border-radius:4px;border:1px solid var(--line-solid);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;color:var(--text-dim);}
  #navbar .icon-btn:hover{border-color:var(--teal);color:var(--text);}
  #navbar .avatar{width:34px;height:34px;border-radius:4px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;border:none;font-size:12.5px;}
  .badge-count{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:9.5px;border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;font-weight:bold;box-shadow:0 0 6px var(--red-glow);}
  .user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .user-chip .uname{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  .notif-panel{position:absolute;top:60px;right:28px;width:330px;max-height:420px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-solid);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:100;}
  .notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-solid);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--text-dim);}
  .notif-head button{background:none;border:none;color:var(--teal);font-size:10.5px;font-weight:600;font-family:var(--mono);}
  .notif-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-solid);cursor:pointer;border-left:2px solid transparent;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item[data-notif]{border-left-color:var(--line-solid);}
  .notif-dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:5px;flex-shrink:0;}
  .notif-item.unread .notif-dot{background:var(--yellow);box-shadow:0 0 5px var(--yellow-glow);}
  .notif-text{font-size:12.5px;color:var(--text);}
  .notif-item.unread .notif-text{font-weight:600;}
  .notif-date{font-size:10px;color:var(--text-faint);margin-top:2px;font-family:var(--mono);}
  .notif-empty{padding:22px;text-align:center;color:var(--text-dim);font-size:12px;}
  @media (max-width:820px){
    #navbar nav{display:none;}
    #navbar .search{display:none;}
    #navbar .bar{height:56px;}
    .user-chip .uname{display:none;}
    .notif-panel{right:14px;left:14px;width:auto;top:56px;}
  }
  #mobilenav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(10,13,19,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line-solid);z-index:50;}
  #mobilenav .row{display:flex;justify-content:space-around;padding:7px 0;}
  #mobilenav a{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:3px;}
  #mobilenav a.active{color:var(--yellow);}
  @media (max-width:820px){ #mobilenav{display:block;} body{padding-bottom:60px;} }

  /* BUTTONS */
  .btn{border-radius:4px;border:1px solid transparent;padding:12px 22px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 0 0 rgba(227,64,42,0);}
  .btn-primary:hover{background:var(--red-dark);box-shadow:0 0 18px rgba(227,64,42,.45);}
  .btn-secondary{background:transparent;color:var(--text);border-color:var(--line-solid);}
  .btn-secondary:hover{border-color:var(--text-dim);background:var(--surface-2);}
  .btn-trade{background:var(--teal);color:#04201c;}
  .btn-trade:hover{background:var(--teal-dark);color:#fff;box-shadow:0 0 18px rgba(34,184,166,.4);}
  .btn-ghost{background:transparent;color:var(--text-dim);border-color:var(--line-solid);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-sm{padding:8px 14px;font-size:10.5px;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-danger-outline{background:transparent;color:var(--red);border-color:var(--red);}
  .btn-danger-outline:hover{background:rgba(227,64,42,.1);}
  .btn-fav{background:var(--surface);border:1px solid var(--line-solid);border-radius:4px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);flex-shrink:0;}
  .btn-fav.active{color:var(--red);border-color:var(--red);}

  /* HERO */
  .hero{position:relative;overflow:hidden;padding:64px 0 68px;border-bottom:1px solid var(--line-solid);background:radial-gradient(ellipse 900px 500px at 15% 0%, rgba(76,141,255,.14), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 20%, rgba(227,64,42,.12), transparent 55%);}
  .hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;}
  @media (max-width:900px){ .hero-grid{grid-template-columns:1fr;} }
  .hero .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .hero .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal-glow);}
  .hero h1{font-size:38px;line-height:1.16;margin-bottom:14px;font-weight:800;letter-spacing:-.5px;}
  .hero h1 .hl{color:var(--yellow);}
  .hero p{color:var(--text-dim);font-size:14.5px;margin-bottom:22px;max-width:480px;line-height:1.6;}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px;}
  .hero-stats{display:flex;gap:22px;flex-wrap:wrap;}
  .hero-stat .val{font-family:var(--mono);font-size:20px;font-weight:bold;color:var(--text);}
  .hero-stat .lbl{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);margin-top:2px;}
  .hero-panel{background:var(--surface);border:1px solid var(--line-solid);border-radius:8px;padding:18px;position:relative;}
  .hero-panel:before{content:'FEATURED';position:absolute;top:-9px;left:16px;background:var(--bg);padding:0 8px;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--yellow);}
  .hero-cards-row{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;}

  .section{padding:44px 0;}
  .section h2{font-size:19px;margin-bottom:4px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
  .section .sub{color:var(--text-dim);font-size:12px;margin-bottom:20px;font-family:var(--mono);}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;}
  @media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;}}

  /* CARD FACE — moldura tipo item de inventário/TCG */
  .cardface{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease;position:relative;}
  .cardface:before{content:'';position:absolute;inset:0;border-radius:var(--radius-lg);padding:1px;pointer-events:none;opacity:0;transition:opacity .14s ease;background:linear-gradient(135deg,var(--teal),transparent 40%);-webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
  .cardface:hover{border-color:var(--teal);box-shadow:0 6px 24px rgba(34,184,166,.15);transform:translateY(-3px);}
  .cardface:hover:before{opacity:1;}
  .cardface.rare-3:before{background:linear-gradient(135deg,var(--gold),transparent 50%);opacity:.6;}
  .cardface.rare-3{border-color:#4a3f22;}
  .cardface .art{aspect-ratio:.716/1;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#eef1f5,#d8dde5);border-bottom:1px solid var(--line-solid);overflow:hidden;padding:6px;}
  .cardface .art:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px);pointer-events:none;}
  .cardface .art .badge-type{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line-solid);z-index:2;}
  .cardface .art .hp{position:absolute;top:10px;right:8px;color:var(--text);font-family:var(--mono);font-weight:bold;font-size:10.5px;background:rgba(10,13,19,.75);padding:2px 6px;border-radius:3px;border:1px solid var(--line-solid);z-index:2;}
  .cardface .art img.card-real-image{width:100%;height:100%;object-fit:contain;display:block;border-radius:4px;position:relative;z-index:1;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .cardface .art svg.art-illustration{width:50%;height:50%;opacity:.95;filter:drop-shadow(0 0 10px rgba(34,184,166,.18));position:relative;z-index:1;}
  .cardface .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .cardface .name{font-family:var(--display);font-weight:800;font-size:13.5px;color:var(--text);letter-spacing:.1px;}
  .cardface .meta-line{font-size:10px;color:var(--text-faint);font-family:var(--mono);}
  .cardface .stars{color:var(--gold);font-size:10.5px;text-shadow:0 0 6px rgba(217,179,77,.4);}
  .cardface .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px;flex-wrap:wrap;}
  .cardface .price{font-family:var(--mono);font-weight:bold;color:var(--text);font-size:14.5px;}
  .tag{border:1px solid var(--line-solid);color:var(--text-dim);border-radius:3px;padding:2px 7px;font-size:9.5px;white-space:nowrap;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;}
  .tag.venda{border-color:var(--red);color:var(--red-glow);}
  .tag.trade{border-color:var(--teal);color:var(--teal-glow);}
  .tag.filled{background:var(--surface-2);color:var(--gold);border:1px solid #3a3320;}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;}
  .variant-chip{display:inline-flex;align-items:center;margin-left:5px;padding:2px 5px;border-radius:3px;border:1px solid var(--teal);color:var(--teal);font:600 9px var(--mono);vertical-align:middle;text-transform:uppercase;letter-spacing:.04em;}
.rarity-chip{font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;padding:2px 6px;border-radius:3px;font-weight:700;}
  .fav-corner{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:4px;background:rgba(10,13,19,.75);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);border:1px solid var(--line-solid);z-index:2;}
  .fav-corner.active{color:var(--red);border-color:var(--red);}
  .cardface .pick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:4px;background:var(--surface);border:1.5px solid var(--line-solid);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;z-index:2;}
  .cardface.selected .pick{background:var(--teal);border-color:var(--teal);}
  .cardface.selected{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}

  /* FILTER PANEL */
  .layout-filters{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start;}
  @media (max-width:820px){.layout-filters{grid-template-columns:1fr;}}
  .filters{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:18px;position:relative;}
  .filters:before{content:'';position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 5px var(--teal-glow);}
  .seller-box{position:relative;}
  .seller-box:before{content:'';position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);}
  .filters h3{font-size:11px;margin-bottom:14px;font-weight:800;font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);}
  .filter-group{margin-bottom:16px;}
  .filter-group .label{font-size:10.5px;font-weight:700;margin-bottom:7px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
  .filter-group label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .filter-group select, .filter-group input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line-solid);border-radius:4px;font-size:12px;background:var(--bg-soft);color:var(--text);font-family:var(--mono);}
  .filter-group select:focus{outline:none;border-color:var(--teal);}
  .active-filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .pill{background:var(--surface-2);border:1px solid var(--line-solid);border-radius:3px;padding:4px 8px;font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;font-family:var(--mono);}
  .pill button{border:none;background:none;color:var(--text-faint);font-size:12px;padding:0;line-height:1;}
  .empty-state{text-align:center;padding:56px 20px;color:var(--text-dim);}
  .empty-state h3{color:var(--text);margin-bottom:8px;font-size:15px;text-transform:uppercase;letter-spacing:.5px;}

  /* DETAIL PAGE — ficha estilo database */
  .detail-grid{display:grid;grid-template-columns:400px 1fr;gap:36px;}
  @media (max-width:820px){.detail-grid{grid-template-columns:1fr;}}
  .detail-big-card{aspect-ratio:.716/1;border-radius:var(--radius-lg);overflow:hidden;position:relative;background:linear-gradient(145deg,#eef1f5,#d8dde5);border:1px solid var(--line-solid);display:flex;align-items:center;justify-content:center;padding:10px;}
  .detail-big-card svg.art-illustration{width:42%;height:42%;opacity:.95;filter:drop-shadow(0 0 22px rgba(34,184,166,.22));}
  .db-header{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--teal);text-transform:uppercase;margin-bottom:6px;}
  .price-big{font-family:var(--mono);font-weight:bold;color:var(--text);font-size:27px;}
  .spec-table{border-top:1px solid var(--line-solid);margin-top:14px;}
  .display-panel{position:relative;border-radius:8px;padding:16px 18px;background:linear-gradient(160deg,rgba(79,141,255,.07),rgba(10,13,19,.4)),var(--surface);border:1px solid rgba(79,141,255,.28);box-shadow:inset 0 0 22px rgba(79,141,255,.05);}
  .display-panel .dp-label{position:absolute;top:-8px;left:14px;background:var(--bg);padding:0 7px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.8px;color:var(--blue);text-transform:uppercase;}
  .display-panel .dp-led{position:absolute;top:10px;right:12px;width:6px;height:6px;border-radius:50%;}
  .spec-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-solid);font-size:12.5px;}
  .spec-row .k{color:var(--text-faint);font-family:var(--mono);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;}
  .spec-row .v{color:var(--text);font-weight:600;}
  .seller-box{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:15px;margin-top:16px;}
  .seller-box .name{font-weight:bold;font-family:var(--mono);color:var(--text);}
  .seller-box .meta{color:var(--text-dim);font-size:11.5px;margin-top:3px;}

  /* FORMS */
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:10.5px;font-weight:700;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-solid);border-radius:4px;font-size:13.5px;font-family:var(--sans);background:var(--bg-soft);color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--teal);}
  .field input.err, .field select.err, .field textarea.err{border-color:var(--red);background:rgba(227,64,42,.08);}
  .err-msg{color:var(--red-glow);font-size:11.5px;margin-top:4px;display:none;}
  .field.has-error .err-msg{display:block;}
  .field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;font-family:var(--mono);}
  .radio-row{display:flex;gap:20px;flex-wrap:wrap;}
  .radio-row label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:400;color:var(--text);}
  .step-track{display:flex;gap:5px;margin-bottom:24px;}
  .step-track .seg{flex:1;height:3px;border-radius:2px;background:var(--line-solid);}
  .step-track .seg.done{background:var(--teal);}

  /* CART */
  .cart-item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:13px;margin-bottom:12px;align-items:center;}

  .summary-box{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:20px;}
  .summary-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:9px;color:var(--text-dim);}
  .summary-row.total{font-weight:bold;font-size:16px;color:var(--text);border-top:1px solid var(--line-solid);padding-top:11px;margin-top:5px;}
  .summary-row.total .val{color:var(--yellow);font-family:var(--mono);}

  /* ORDER TRACKING — estilo HUD/missão */
  .order-card{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .track{display:flex;align-items:center;margin:18px 0;}
  .track .step{flex:1;text-align:center;position:relative;}
  .track .dot{width:20px;height:20px;border-radius:50%;background:var(--bg-soft);border:2px solid var(--line-solid);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .track .step.done .dot{background:var(--teal);border-color:var(--teal);box-shadow:0 0 8px rgba(34,184,166,.5);}
  .track .step.current .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(245,195,36,.5);}
  .track .line{position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line-solid);z-index:-1;}
  .track .step.done .line, .track .step.current .line{background:var(--teal);}
  .track .step:first-child .line{display:none;}
  .track .lbl{font-size:9px;color:var(--text-faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;}
  .track .step.done .lbl, .track .step.current .lbl{color:var(--text);font-weight:600;}

  /* TRADES — comparação MEU ITEM ⇄ ITEM DESEJADO */
  .trade-card{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .trade-status{padding:3px 10px;border-radius:3px;font-size:9.5px;font-weight:700;color:#fff;display:inline-block;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .swap-layout{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .swap-icon{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-solid);display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:14px;flex-shrink:0;}
  .swap-col .swap-label{font-size:9.5px;color:var(--text-faint);margin-bottom:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}

  /* PROFILE — collector profile */
  .profile-head{background:linear-gradient(180deg,var(--surface),var(--bg));padding:36px 0;border-bottom:1px solid var(--line-solid);}
  .profile-head .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .avatar-lg{width:64px;height:64px;border-radius:6px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;font-family:var(--display);flex-shrink:0;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-solid);margin:24px 0;flex-wrap:wrap;overflow-x:auto;}
  .tabs button{background:none;border:1px solid transparent;padding:9px 13px;font-size:11px;color:var(--text-dim);border-radius:4px 4px 0 0;white-space:nowrap;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .tabs button.active{color:var(--yellow);border-color:var(--line-solid);border-bottom-color:var(--surface);background:var(--surface);}

  /* ADMIN */
  .admin-layout{display:grid;grid-template-columns:230px 1fr;min-height:70vh;}
  @media (max-width:820px){.admin-layout{grid-template-columns:1fr;}}
  .admin-side{background:var(--surface);border-right:1px solid var(--line-solid);padding:22px 12px;}
  .admin-side .item{padding:10px 14px;border-radius:4px;font-size:11.5px;color:var(--text-dim);cursor:pointer;margin-bottom:3px;font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;}
  .admin-side .item.active{background:var(--surface-2);color:var(--yellow);}
  .admin-main{padding:26px;}
  .kpi-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .kpi{background:var(--surface);border:1px solid var(--line-solid);border-radius:var(--radius-lg);padding:14px 18px;min-width:140px;}
  .kpi .val{font-family:var(--mono);font-size:19px;font-weight:bold;color:var(--yellow);}
  .kpi .lbl{color:var(--text-faint);font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-solid);font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono);}
  table td{padding:11px 8px;border-bottom:1px solid var(--line-solid);color:var(--text-dim);}
  .badge{padding:3px 9px;border-radius:3px;font-size:10px;font-weight:700;color:#fff;display:inline-block;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-solid);color:var(--text);padding:13px 20px;border-radius:6px;font-size:13px;font-family:var(--mono);z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.error{border-color:var(--red);color:var(--red-glow);}
  .toast.success{border-color:var(--teal);color:var(--teal-glow);}
  footer{background:var(--bg-soft);border-top:1px solid var(--line-solid);color:var(--text-dim);padding:32px 0;margin-top:36px;font-size:12px;}
  footer .brand{color:var(--text);font-family:var(--display);font-weight:800;font-size:15px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .breadcrumb{font-size:11.5px;color:var(--text-dim);margin-bottom:16px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .breadcrumb:hover{color:var(--teal);}
  .helper-note{background:rgba(217,179,77,.08);border:1px solid #4a3f22;border-radius:4px;padding:13px 15px;font-size:12px;color:var(--gold-glow);margin-bottom:18px;}
  .auth-note{background:rgba(76,141,255,.08);border:1px solid #22335c;border-radius:4px;padding:12px 14px;font-size:11.5px;color:#9db8ee;margin-bottom:16px;}
  .divider{height:1px;background:var(--line-solid);margin:18px 0;}
  .empty-inline{color:var(--text-dim);font-size:13px;padding:20px 0;}
  .credit{font-size:10px;color:var(--text-faint);opacity:.8;font-family:var(--mono);}
  .modal-overlay{position:fixed;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--line-solid);border-radius:8px;padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal-icon{font-size:30px;margin-bottom:10px;}
  .modal-box h3{font-size:17px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
  .modal-box p{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:18px;}
  .modal-actions{display:flex;flex-direction:column;gap:9px;}
  .upload-box{width:130px;height:130px;border:1.5px dashed var(--line-solid);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-faint);font-size:11px;font-family:var(--mono);cursor:pointer;position:relative;overflow:hidden;background:var(--bg-soft);}
  .upload-box:hover{border-color:var(--teal);color:var(--teal);}
  .upload-box img{width:100%;height:100%;object-fit:cover;}
  .upload-plus{font-size:26px;line-height:1;}
  .upload-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:4px;background:rgba(10,13,19,.85);border:1px solid var(--line-solid);color:#fff;font-size:11px;cursor:pointer;}
  .chat-window{background:var(--surface);border:1px solid var(--line-solid);border-radius:8px;padding:16px;max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:14px;}
  .chat-msg{display:flex;gap:10px;align-items:flex-start;}
  .chat-msg.self{flex-direction:row-reverse;text-align:right;}
  .chat-avatar{width:28px;height:28px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-solid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:var(--teal);flex-shrink:0;font-family:var(--mono);}
  .chat-bubble{background:var(--bg-soft);border:1px solid var(--line-solid);border-radius:6px;padding:8px 12px;font-size:12.5px;color:var(--text);max-width:420px;display:inline-block;}
  .chat-msg.self .chat-bubble{background:#123a34;border-color:var(--teal-dark);}
  .chat-bubble strong{color:var(--teal);font-family:var(--mono);font-size:11px;}
  .chat-time{font-size:9.5px;color:var(--text-faint);margin-top:3px;font-family:var(--mono);}
  .chat-input-row{display:flex;gap:10px;}
  .chat-input-row input{flex:1;padding:11px 14px;border:1px solid var(--line-solid);border-radius:4px;background:var(--bg-soft);color:var(--text);font-size:13px;}
  .avatar-lg{position:relative;cursor:pointer;}
  .avatar-edit-badge{position:absolute;bottom:-3px;right:-3px;width:20px;height:20px;border-radius:4px;background:var(--teal);color:#04201c;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy,#0F1420);}
  .avatar-picker{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:16px;}
  .avatar-picker-label{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
  .avatar-grid{display:flex;gap:10px;flex-wrap:wrap;}
  .avatar-option{width:46px;height:46px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line-solid);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .avatar-option:hover{border-color:var(--text-dim);}
  .avatar-option.selected{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}
  .dpad-row{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-solid);}
  .dpad{position:relative;width:78px;height:78px;flex-shrink:0;}
  .dpad-btn{position:absolute;background:var(--bg-soft);border:1px solid var(--line-solid);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:background .1s ease,color .1s ease;}
  .dpad-btn:hover{background:var(--surface-2);color:var(--teal);}
  .dpad-btn:active{background:var(--teal);color:#04201c;}
  .dpad-up{top:0;left:26px;width:26px;height:24px;border-radius:4px 4px 0 0;}
  .dpad-down{bottom:0;left:26px;width:26px;height:24px;border-radius:0 0 4px 4px;}
  .dpad-left{left:0;top:27px;width:24px;height:26px;border-radius:4px 0 0 4px;}
  .dpad-right{right:0;top:27px;width:24px;height:26px;border-radius:0 4px 4px 0;}
  .dpad-center{top:24px;left:24px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--yellow);font-size:9px;}
  .dpad-hint{font-family:var(--mono);font-size:10px;color:var(--text-faint);line-height:1.5;}
  .explore-pager{display:flex;align-items:center;gap:14px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line-solid);}
  .dpad-sm{width:66px;height:66px;}
  .dpad-sm .dpad-up, .dpad-sm .dpad-down{left:22px;width:22px;height:20px;}
  .dpad-sm .dpad-left, .dpad-sm .dpad-right{top:23px;width:20px;height:22px;}
  .dpad-sm .dpad-center{top:20px;left:20px;width:26px;height:26px;}
  @media (max-width:600px){ .track .lbl{font-size:8px;} .track .dot{width:16px;height:16px;} }
  @media (max-width:600px){
    .chat-window{max-height:320px;padding:12px;}
    .chat-bubble{max-width:230px;font-size:12px;}
    .chat-input-row{flex-direction:column;}
    .chat-input-row .btn{width:100%;}
    .avatar-option{width:40px;height:40px;}
    .dpad{width:64px;height:64px;}
    .dpad-up,.dpad-down{left:21px;width:22px;height:20px;}
    .dpad-left,.dpad-right{top:22px;width:20px;height:20px;}
    .dpad-center{top:19px;left:19px;width:26px;height:26px;}
    .dpad-row{flex-direction:column;align-items:flex-start;gap:8px;}
    .hero-cards-row{grid-template-columns:1fr;}
    .explore-pager{flex-wrap:wrap;}
  }
  @media (max-width:480px){
    .modal-box{padding:22px;}
    .upload-box{width:110px;height:110px;}
  }
</style>

<body>
<div id="topstrip"></div>
<div id="navbar"></div>

<div id="mobilenav"></div>

<div id="modal-root"></div>
<script>
/* =====================================================
   POKÉTRADE — aplicação web
   Dados centralizados + persistência em localStorage
===================================================== */
const DB_KEY = "poketrade_db_v5";

/* ---------------- TIPOS POKÉMON (os 18 tipos oficiais) ---------------- */
const TYPE_COLORS = {
  normal:   {fill:"#B8C0D4"}, fogo:     {fill:"#FF6B4A"}, agua:     {fill:"#3FA9F5"},
  grama:    {fill:"#4CD98A"}, eletrico: {fill:"#FFD23F"}, gelo:     {fill:"#7DE0E6"},
  lutador:  {fill:"#E0654A"}, venenoso: {fill:"#B36FD6"}, terrestre:{fill:"#D9B36B"},
  voador:   {fill:"#9AB6F5"}, psiquico: {fill:"#F76BB0"}, inseto:   {fill:"#A8D94C"},
  pedra:    {fill:"#C2A66B"}, fantasma: {fill:"#8E7FE0"}, dragao:   {fill:"#6E8CF0"},
  sombrio:  {fill:"#9096A6"}, aco:      {fill:"#B9C4CE"}, fada:     {fill:"#F5A8D0"},
};
const TYPE_LABEL = {
  normal:"Normal", fogo:"Fogo", agua:"Água", grama:"Grama", eletrico:"Elétrico", gelo:"Gelo",
  lutador:"Lutador", venenoso:"Venenoso", terrestre:"Terrestre", voador:"Voador", psiquico:"Psíquico",
  inseto:"Inseto", pedra:"Pedra", fantasma:"Fantasma", dragao:"Dragão", sombrio:"Sombrio",
  aco:"Aço", fada:"Fada",
};
const TYPE_ORDER = Object.keys(TYPE_LABEL);
const COND_LABEL = {nova:"Nova", quasenova:"Quase nova", jogada:"Jogada", danificada:"Danificada"};
const COND_ORDER = Object.keys(COND_LABEL);
const RARITY_TIERS = {
  1:{label:"Comum", color:"#9AA6BE"},
  2:{label:"Incomum", color:"#4CD98A"},
  3:{label:"Rara", color:"#3FA9F5"},
  4:{label:"Ultra Rara", color:"#D9B34D"},
};

/* Fallback visual para casos em que uma imagem externa não esteja disponível. */
function creatureSVG(type){
  const c = TYPE_COLORS[type]||TYPE_COLORS.normal;
  return `<svg class="art-illustration" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <g fill="${c.fill}" opacity="0.92">
      <path d="M36 78 C30 55 46 32 60 32 C74 32 90 55 84 78 C80 94 40 94 36 78 Z"/>
      <path d="M45 34 L39 15 L54 30 Z"/>
      <path d="M75 34 L81 15 L66 30 Z"/>
    </g>
    <circle cx="52" cy="70" r="3.6" fill="#0A0D13"/>
    <circle cx="68" cy="70" r="3.6" fill="#0A0D13"/>
  </svg>`;
}
function cardArtHTML(c){
  const realImagem = c.imagem || REAL_CARD_IMAGES[c.name] || REAL_CARD_IMAGES[c.pokemon] || "";
  if(realImagem){
    return `<img src="${realImagem}" alt="${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('image-fallback');this.parentElement.insertAdjacentHTML('beforeend', creatureSVG('${c.type}'));" class="card-real-image" style="width:100%;height:100%;object-fit:contain;position:relative;z-index:1;">`;
  }
  return creatureSVG(c.type);
}
/* Glifos visuais dos tipos. */
function typeGlyphPath(type){
  const shapes = {
    normal:   `<circle cx="12" cy="12" r="6"/>`,
    fogo:     `<path d="M12 4c4 4 4 7 1 9 1-3-1-4-2-4 0 2-2 3-2 5 0 3 2 5 3 5-4 0-7-3-7-7 0-4 3-6 7-8z"/>`,
    agua:     `<path d="M12 4c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>`,
    grama:    `<path d="M6 18C6 9 12 5 18 5c0 8-4 13-12 13z"/><line x1="6" y1="19" x2="16" y2="7" stroke="#0A0D13" stroke-width="1.2"/>`,
    eletrico: `<path d="M13 3 5 13h5l-1 8 8-11h-5l1-7z"/>`,
    gelo:     `<g stroke="currentColor" stroke-width="1.6"><line x1="12" y1="3" x2="12" y2="21"/><line x1="4" y1="7" x2="20" y2="17"/><line x1="4" y1="17" x2="20" y2="7"/></g>`,
    lutador:  `<path d="M12 3 20 9v8l-8 4-8-4V9z"/>`,
    venenoso: `<path d="M12 3c4 3 6 6 6 9a6 6 0 1 1-12 0c0-3 2-6 6-9z"/><circle cx="12" cy="14" r="1.6" fill="#0A0D13"/>`,
    terrestre:`<path d="M3 18 9 6l4 6 2-3 6 9z"/>`,
    voador:   `<path d="M2 13c4-6 8-8 10-8-2 3-2 6 0 8-2 0-6-1-10 0z"/><path d="M22 13c-4-6-8-8-10-8 2 3 2 6 0 8 2 0 6-1 10 0z"/>`,
    psiquico: `<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4"/>`,
    inseto:   `<polygon points="12,3 19,8 16,20 8,20 5,8"/>`,
    pedra:    `<polygon points="4,16 8,6 14,4 20,10 18,18 8,20"/>`,
    fantasma: `<path d="M6 20V11a6 6 0 0 1 12 0v9l-2.5-2-2 2-1.5-1.5-1.5 1.5-2-2z"/>`,
    dragao:   `<path d="M3 17c3-8 8-13 13-14-1 3-3 4-3 7 3 0 6 1 8 4-4 0-7 0-9 2-1 2-1 4 0 6-4-1-7-3-9-5z"/>`,
    sombrio:  `<path d="M15 3a9 9 0 1 0 6 15 9 9 0 0 1-6-15z"/>`,
    aco:      `<polygon points="12,3 20,8 20,16 12,21 4,16 4,8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3"/>`,
    fada:     `<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>`,
  };
  return shapes[type] || shapes.normal;
}
function typeBadgeSVG(type, size){
  const c = TYPE_COLORS[type]||TYPE_COLORS.normal;
  const s = size||14;
  return `<div class="badge-type" style="box-shadow:inset 0 0 0 1px ${c.fill}55;" title="${TYPE_LABEL[type]}">
    <svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c.fill}" style="color:${c.fill}">${typeGlyphPath(type)}</svg>
  </div>`;
}

/* ---------------- CATÁLOGO BASE (fixo, não editável pelo usuário) ----------------
   Estrutura de dados por carta: id, name (nome de impressão), pokemon (espécie),
   type, hp, rarity, edition (coleção), num, condCode, avail, price, tradefor,
   seller/sellerName/rating (vendedor), imagem e referência da carta. */
const SELLERS = [
  {seller:"ashketchum_rj", sellerName:"Ash Ketchum", rating:312},
  {seller:"mistywater", sellerName:"Misty Water", rating:188},
  {seller:"brockrocha", sellerName:"Brock Rocha", rating:241},
  {seller:"giovannirj", sellerName:"Giovanni Reis", rating:156},
  {seller:"erikapkmn", sellerName:"Erika Fujimoto", rating:97},
];
const EDITIONS = ["Escarlate e Violeta","Paldea Evoluída","Destinos de Paldea","151","Chama Obsidiana",
  "Fenda Paradoxal","Base Set Reimpressa","Estrelas Brilhantes","Astro Radiante","Reino Coroado","Lendas Cintilantes"];
const AVAIL_CYCLE = ["venda","venda","ambos","troca","venda","ambos"];
/* Referências visuais de cartas reais do Pokémon TCG. As imagens são carregadas

function buildCatalog(){
  return POKEMON_ROSTER.map((row, i) => {
    const [displayName, pokemon, type, imageKey, rarity] = row;
    const s = SELLERS[i % SELLERS.length];
    const condCode = COND_ORDER[i % COND_ORDER.length];
    const avail = AVAIL_CYCLE[i % AVAIL_CYCLE.length];
    const edition = REAL_CARD_EDITIONS[displayName] || EDITIONS[i % EDITIONS.length];
    const basePrice = [0,60,110,220,420][rarity] || 90;
    const price = basePrice + ((i*37) % 80);
    return {
      id: i+1, name: displayName, pokemon, type, rarity,
      hp: 60 + rarity*40 + (i%5)*8, edition, num: imageKey.split('-').pop(),
      condCode, avail, price: (avail === "troca") ? null : price,
      tradefor: (avail === "troca" || avail === "ambos") ? `Cartas do tipo ${TYPE_LABEL[TYPE_ORDER[(i+4)%TYPE_ORDER.length]].toLowerCase()}, ${COND_LABEL[condCode].toLowerCase()} ou melhor` : null,
      seller: s.seller, sellerName: s.sellerName, rating: s.rating,
      imagem: REAL_CARD_IMAGES[displayName] || REAL_CARD_IMAGES[pokemon] || "",
      imagemFonte: (REAL_CARD_IMAGES[displayName] || REAL_CARD_IMAGES[pokemon]) ? "Pokémon TCG" : "",
      cardRef: imageKey
    };
  });
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) throw new Error("empty");
    const parsed = JSON.parse(raw);
    if(!parsed.users) throw new Error("invalid");
    if(!parsed.notifications) parsed.notifications = [];
    if(typeof parsed.notifSeq !== "number") parsed.notifSeq = parsed.notifications.length;
    if(!parsed.chat) parsed.chat = {br:[], global:[]};
    if(typeof parsed.chatSeq !== "number") parsed.chatSeq = 0;
    return parsed;
  }catch(e){
    const fresh = seedDB();
    saveDB(fresh);
    return fresh;
  }
}

  localStorage.setItem(DB_KEY, JSON.stringify(db));

/* Frete simulado a partir do CEP — sem API real, apenas uma função determinística */
function calcFrete(cep){
  const digits = (cep||"").replace(/\D/g,"");
  if(digits.length < 8) return null;
  let sum = 0;
  for(const ch of digits) sum += Number(ch);
  const valor = 12.9 + (sum % 9) * 3.4;
  const prazo = 3 + (sum % 6);
  return { valor: Math.round(valor*100)/100, prazo };
}

/* ---------------- EXPLORAR / BUSCA ---------------- */
function editionsList(){
  return [...new Set(allCards().map(c=>c.edition).filter(Boolean))].sort();
}
function priceRange(){
  const prices = allCards().map(c=>c.price).filter(Boolean);
  return { min: Math.min(...prices), max: Math.max(...prices) };
}
function sortResults(results){
  const s = state.sortBy;
  const withPrice = results.filter(c=>c.price);
  const withoutPrice = results.filter(c=>!c.price);
  if(s === "menor-preco"){ withPrice.sort((a,b)=>a.price-b.price); return withPrice.concat(withoutPrice); }
  if(s === "maior-preco"){ withPrice.sort((a,b)=>b.price-a.price); return withPrice.concat(withoutPrice); }
  if(s === "recentes"){ return [...results].sort((a,b)=>b.id-a.id); }
  return results; // relevância = ordem original do catálogo
}
const EXPLORE_PAGE_SIZE = 9;
function viewExplorar(){
  const f = state.filters;
  const pr = priceRange();
  const maxPrice = f.maxPrice || pr.max;
  let results = allCards().filter(c=>{
    const q = state.search.trim().toLowerCase();
    const matchesText = !q || c.name.toLowerCase().includes(q) || (c.pokemon||"").toLowerCase().includes(q) || (c.edition||"").toLowerCase().includes(q);
    const matchesType = !f.type || c.type===f.type;
    const matchesAvail = !f.avail || c.avail===f.avail || c.avail==="ambos";
    const matchesCond = !f.cond || c.condCode===f.cond;
    const matchesEdition = !f.edition || c.edition===f.edition;
    const matchesRarity = !f.rarity || String(c.rarity)===String(f.rarity);
    const matchesPrice = !c.price || c.price<=maxPrice;
    return matchesText && matchesType && matchesAvail && matchesCond && matchesEdition && matchesRarity && matchesPrice;
  });
  results = sortResults(results);
  const totalPages = Math.max(1, Math.ceil(results.length / EXPLORE_PAGE_SIZE));
  const page = Math.min(state.explorePage||0, totalPages-1);
  const pageResults = results.slice(page*EXPLORE_PAGE_SIZE, page*EXPLORE_PAGE_SIZE + EXPLORE_PAGE_SIZE);

  const activePills = [];
  if(f.type) activePills.push(["type", "Tipo: "+TYPE_LABEL[f.type]]);
  if(f.avail) activePills.push(["avail", "Disponibilidade: "+(f.avail==='venda'?'à venda':'troca')]);
  if(f.cond) activePills.push(["cond", "Condição: "+COND_LABEL[f.cond]]);
  if(f.edition) activePills.push(["edition", "Coleção: "+f.edition]);
  if(f.rarity) activePills.push(["rarity", "Raridade: "+RARITY_TIERS[f.rarity].label]);
  if(f.maxPrice && f.maxPrice<pr.max) activePills.push(["maxPrice","Até "+fmtPrice(f.maxPrice)]);
  if(state.search) activePills.push(["search","Busca: “"+state.search+"”"]);

  return `
    <div class="container section">
      <div class="breadcrumb" data-nav="home">‹ Voltar para a Home</div>

            <option value="relevancia" ${state.sortBy==='relevancia'?'selected':''}>Relevância</option>
            <option value="menor-preco" ${state.sortBy==='menor-preco'?'selected':''}>Menor preço</option>
            <option value="maior-preco" ${state.sortBy==='maior-preco'?'selected':''}>Maior preço</option>
            <option value="recentes" ${state.sortBy==='recentes'?'selected':''}>Mais recentes</option>
          </select>
        </div>
      </div>
      <div class="layout-filters">
        <div class="filters">
          <h3>Filtros</h3>
          ${activePills.length?`<div class="active-filter-pills">${activePills.map(([k,l])=>`<div class="pill">${esc(l)}<button data-unfilter="${k}">✕</button></div>`).join("")}</div>`:``}
          <div class="filter-group">
            <div class="label">Tipo</div>
            <select id="f-type">
              <option value="">Todos</option>
              ${Object.keys(TYPE_LABEL).map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${TYPE_LABEL[t]}</option>`).join("")}
            </select>
          </div>

            <select id="f-edition">
              <option value="">Todas</option>
              ${editionsList().map(e=>`<option value="${esc(e)}" ${f.edition===e?'selected':''}>${esc(e)}</option>`).join("")}
            </select>
          </div>

              ${Object.entries(COND_LABEL).map(([k,l])=>`<option value="${k}" ${f.cond===k?'selected':''}>${l}</option>`).join("")}

        </div>
        <div>
          ${pageResults.length? `
            <div class="grid">${pageResults.map(c=>cardFace(c)).join("")}</div>
            ${totalPages>1?`
            <div class="explore-pager">
              <div class="dpad dpad-sm" title="Navegar entre páginas de resultados">
                <button class="dpad-btn dpad-up" data-page-dpad="first" aria-label="Primeira página">▲</button>
                <button class="dpad-btn dpad-left" data-page-dpad="prev" aria-label="Página anterior">◀</button>
                <button class="dpad-btn dpad-center" data-page-dpad="top" aria-label="Voltar ao topo">●</button>

  `;

/* ---------------- CARRINHO / CHECKOUT COM FRETE POR CEP ---------------- */
function viewCarrinho(){
  const items = db.cart.map(it=>({...it, card: findCard(it.id)})).filter(it=>it.card);
  const subtotal = items.reduce((a,i)=>a+i.card.price*i.qty,0);
  const cep = state.cepInput || "";
  const frete = calcFrete(cep);
  const freteValor = frete ? frete.valor : 0;
  const total = subtotal + freteValor;
  if(!items.length){
    return `<div class="container section">
      <h2>Seu carrinho</h2>
      <div class="empty-state">
        <h3>Seu carrinho está vazio</h3>
        <p>Explore cartas disponíveis e adicione suas favoritas.</p>
        <button class="btn btn-primary" data-nav="explorar" style="margin-top:16px;">Explorar cartas</button>
      </div>
    </div>${footerHtml()}`;
  }
  return `

      <div class="sub">${items.length} carta(s) selecionada(s)</div>
      <div class="detail-grid" style="grid-template-columns:1fr 380px;">

                <div style="font-weight:bold;font-family:var(--display);">${esc(it.card.name)}</div>
                <div style="font-size:11.5px;color:var(--muted);">Condição: ${COND_LABEL[it.card.condCode]}</div>
                <div class="qty-ctrl">
                  <button data-qty="dec" data-id="${it.id}">−</button>
                  <span>${it.qty}</span>
                  <button data-qty="inc" data-id="${it.id}">+</button>
                </div>
              </div>
              <div style="text-align:right;">
                <div class="price" style="font-size:15px;">${fmtPrice(it.card.price*it.qty)}</div>
                <div style="font-size:11px;color:var(--muted);cursor:pointer;margin-top:8px;" data-qty="remove" data-id="${it.id}">remover</div>
              </div>
            </div>`).join("")}
        </div>
        <div class="summary-box display-panel">
          <div class="dp-label">Resumo do pedido</div>
          <div class="dp-led" style="background:var(--blue);box-shadow:0 0 5px var(--blue);"></div>
          <div class="field" style="margin-bottom:14px;margin-top:10px;">
            <label>CEP para calcular o frete</label>

              <input id="cep-input" type="text" placeholder="00000-000" value="${esc(cep)}" maxlength="9">

/* ---------------- PEDIDOS (histórico + acompanhamento) ---------------- */
const ORDER_STAGES = ["Pedido realizado","Pagamento confirmado","Preparando envio","Enviado","Entregue"];
function orderTrackHtml(order){
  const cur = order.statusHistory.length - 1;
  return `<div class="track">
    ${ORDER_STAGES.map((s,i)=>`
      <div class="step ${i<cur?'done':''} ${i===cur?'current':''}">
        <div class="line"></div>
        <div class="dot">${i<cur?'✓':''}</div>
        <div class="lbl">${s}</div>
      </div>`).join("")}
  </div>`;
}
/* ---------------- CHAT (BR / Global) ---------------- */
function doSendChatMessage(channel, text){
  const u = currentUser();
  if(!u || !text.trim()) return;
  db.chat[channel].push({from:u.handle, text:text.trim(), date:Date.now(), self:true});
  persist();
  const repliers = channel === "br"
    ? ["mistywater","brockrocha","giovannirj","erikapkmn"]
    : ["ash_trainer_us","pkmn_kanto"];
  const replies = channel === "br"
    ? ["Boa! Eu tenho uma pra negociar, te chamo por trocas.", "Já vi esse pedido em outro canal, boa sorte na busca!", "Dá uma olhada no catálogo, acho que apareceu uma hoje.", "Aqui também tô de olho nessa carta 👀"]
    : ["Nice find, good luck with the trade!", "I might have one, check my profile.", "That set has been popular lately.", "Welcome to the community!"];
  setTimeout(()=>{
    db.chat[channel].push({
      from: repliers[Math.floor(Math.random()*repliers.length)],
      text: replies[Math.floor(Math.random()*replies.length)],
      date: Date.now(),
    });
    persist();
    if(state.view === "chat" && (state.chatChannel||"br") === channel) render();
  }, 1600);
}

function render(){

  const views = {
    home: viewHome, explorar: viewExplorar, detalhe: viewDetalhe,
    carrinho: viewCarrinho, troca: viewTroca, "troca-revisao": viewTrocaRevisao,
    contraproposta: viewContraproposta, trocas: viewTrocas,
    publicar: viewPublicar, login: viewLogin, perfil: viewPerfil, admin: viewAdmin,
    pedido: viewPedidoDetalhe, chat: viewChat,
  };
  const fn = views[state.view] || viewHome;
  app.innerHTML = fn();
  document.getElementById("modal-root").innerHTML = authPromptHtml();
  bindDynamicInputs();
}

function bindDynamicInputs(){
  const input = document.getElementById("navsearch");
  if(input){
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        state.search = input.value;
        go("explorar");
      }
    });
  }
  const fType = document.getElementById("f-type");
  if(fType) fType.addEventListener("change", ()=>{ state.filters.type = fType.value; state.explorePage = 0; render(); });
  const fEdition = document.getElementById("f-edition");
  if(fEdition) fEdition.addEventListener("change", ()=>{ state.filters.edition = fEdition.value; state.explorePage = 0; render(); });
  const fCond = document.getElementById("f-cond");
  if(fCond) fCond.addEventListener("change", ()=>{ state.filters.cond = fCond.value; state.explorePage = 0; render(); });
  const fRarity = document.getElementById("f-rarity");
  if(fRarity) fRarity.addEventListener("change", ()=>{ state.filters.rarity = fRarity.value; state.explorePage = 0; render(); });
  document.querySelectorAll('input[name="avail"]').forEach(r=>{
    r.addEventListener("change", ()=>{ state.filters.avail = r.value; state.explorePage = 0; render(); });
  });
  const fPrice = document.getElementById("f-price");
  if(fPrice) fPrice.addEventListener("input", ()=>{ state.filters.maxPrice = Number(fPrice.value); state.explorePage = 0; render(); });
  const fSort = document.getElementById("f-sort");
  if(fSort) fSort.addEventListener("change", ()=>{ state.sortBy = fSort.value; render(); });
  const cepInput = document.getElementById("cep-input");
  if(cepInput){
    cepInput.addEventListener("input", ()=>{ state.cepInput = cepInput.value; });
    cepInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ render(); } });
  }
  bindUploadBox("frente");
  bindUploadBox("verso");
  const chatInput = document.getElementById("chat-input");
  if(chatInput){
    chatInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && chatInput.value.trim()){
        doSendChatMessage(state.chatChannel || "br", chatInput.value);
        render();
        const win = document.getElementById("chat-window");
        if(win) win.scrollTop = win.scrollHeight;
      }
    });
  }
}
const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;
const ALLOWED_IMAGE_TYPES = ["image/jpeg","image/png","image/webp"];
function bindUploadBox(target){
  const box = document.getElementById("upload-" + target);
  const input = document.getElementById("file-" + target);
  if(!box || !input) return;
  box.addEventListener("click", (e)=>{
    if(e.target.closest("[data-remove-img]")) return;
    input.click();
  });
  input.addEventListener("change", ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    if(!ALLOWED_IMAGE_TYPES.includes(file.type)){
      state.publishData._errUpload = "Formato inválido. Envie um arquivo JPG, PNG ou WEBP.";
      render();
      return;
    }
    if(file.size > MAX_UPLOAD_BYTES){
      state.publishData._errUpload = "Arquivo maior que 5 MB. Escolha uma imagem menor.";
      render();
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      state.publishData._errUpload = null;
      if(target === "frente") state.publishData.imgFrente = reader.result;
      else state.publishData.imgVerso = reader.result;
      render();
    };
    reader.onerror = () => {
      state.publishData._errUpload = "Não foi possível ler o arquivo. Tente novamente.";
      render();
    };
    reader.readAsDataURL(file);
  });
}

/* =====================================================
   AÇÕES DE NEGÓCIO (separadas da UI p/ clareza e testes)
===================================================== */
function doAddToCart(cardId){
  const c = findCard(cardId);
  const existing = db.cart.find(i=>i.id===c.id);
  if(existing) existing.qty++;
  else db.cart.push({id:c.id, qty:1});
  persist();
  toast(`${c.name} adicionada ao carrinho`, "success");
}
function doToggleFavorite(cardId){
  const c = findCard(cardId);
  const idx = db.favorites.indexOf(cardId);
  if(idx>=0){ db.favorites.splice(idx,1); toast("Removida dos favoritos"); }
  else { db.favorites.push(cardId); toast("Adicionada aos favoritos", "success"); addNotification(`"${c.name}" foi adicionada aos seus favoritos`, "fav"); }
  persist();
}
function doCheckout(){
  const items = db.cart.map(it=>({...it, card: findCard(it.id)})).filter(it=>it.card);
  const subtotal = items.reduce((a,i)=>a+i.card.price*i.qty,0);
  const frete = calcFrete(state.cepInput);
  if(!frete) return false;
  const payEl = document.querySelector('input[name="pay"]:checked');
  const payment = payEl ? payEl.parentElement.textContent.trim() : "PIX";
  db.orderSeq++;
  const orderId = "PT-" + db.orderSeq;
  const forecastDate = Date.now() + frete.prazo*86400000;
  const order = {
    id: orderId,
    date: Date.now(),
    items: items.map(i=>({id:i.id, name:i.card.name, price:i.card.price, qty:i.qty})),
    subtotal, frete: frete.valor, total: subtotal+frete.valor,
    payment, forecastDate, freteInfo: frete,
    statusHistory: [{status:"Pedido realizado", date:Date.now()}],
  };
  db.orders.push(order);
  db.cart = [];
  persist();
  addNotification(`Pedido ${orderId} realizado com sucesso`, "order");
  // confirmação automática de pagamento (simulação de automação)
  setTimeout(()=>{
    const o = db.orders.find(x=>x.id===orderId);
    if(o && o.statusHistory.length===1){
      o.statusHistory.push({status:"Pagamento confirmado", date:Date.now()});
      persist();
      addNotification(`Pagamento do pedido ${orderId} confirmado`, "order");
    }
  }, 1200);
  state.lastOrderId = orderId;
  return true;
}
function doAdvanceOrder(orderId){
  const o = db.orders.find(x=>x.id===orderId);
  if(!o) return;
  const next = ORDER_STAGES[o.statusHistory.length];
  if(next){
    o.statusHistory.push({status: next, date: Date.now()});
    persist();
    toast(`Status atualizado: ${next}`, "success");
    if(next==="Enviado") addNotification(`Seu pedido ${orderId} foi enviado`, "order");
    if(next==="Entregue") addNotification(`Seu pedido ${orderId} foi entregue`, "order");
  }
}
function doSendTrade(){
  const target = findCard(state.tradeTargetId);
  const offered = MY_CARDS_POOL.filter(c=>state.tradeOffered.has(c.id));
  const msg = (document.getElementById("trade-msg")||{}).value || "";
  const tradeId = "TR-" + (2000 + db.trades.length);
  const trade = {
    id: tradeId,
    direction: "enviada",
    withHandle: target.seller, withName: target.sellerName || target.seller,
    targetCard: {id:target.id, name:target.name, type:target.type, hp:target.hp, rarity:target.rarity},
    offeredCards: offered.map(c=>({id:c.id, name:c.name, type:c.type, hp:c.hp, rarity:c.rarity})),
    message: msg, status: "aguardando", createdAt: Date.now(),
  };
  db.trades.push(trade);
  persist();
  addNotification(`Proposta de troca enviada para @${target.seller}`, "trade");
  // resposta automática simulada do outro colecionador (demonstração de automação)
  setTimeout(()=>{
    const t = db.trades.find(x=>x.id===tradeId);
    if(t && t.status==="aguardando"){
      t.status = Math.random() < 0.7 ? "aceita" : "recusada";
      persist();
      addNotification(`@${t.withHandle} ${t.status==='aceita'?'aceitou':'recusou'} sua proposta de troca`, "trade");
    }
  }, 4000);
}
function doTradeAction(tradeId, action){
  const t = db.trades.find(x=>x.id===tradeId);
  if(!t) return;
  if(action==="aceitar"){ t.status="aceita"; persist(); toast("Proposta aceita! A troca foi combinada.", "success"); addNotification(`Você aceitou a troca com @${t.withHandle}`, "trade"); }
  if(action==="recusar"){ t.status="recusada"; persist(); toast("Proposta recusada."); addNotification(`Você recusou a troca com @${t.withHandle}`, "trade"); }
  if(action==="concluir"){ t.status="concluida"; persist(); toast("Troca marcada como concluída!", "success"); addNotification(`Troca com @${t.withHandle} concluída`, "trade"); }
}
function doSendCounter(tradeId){
  const t = db.trades.find(x=>x.id===tradeId);
  if(!t) return;
  const offered = MY_CARDS_POOL.filter(c=>state.tradeOffered.has(c.id));
  t.status = "contraproposta";
  t.counterOfferedCards = offered.map(c=>({id:c.id, name:c.name, type:c.type, hp:c.hp, rarity:c.rarity}));
  persist();
  addNotification(`Contraproposta enviada para @${t.withHandle}`, "trade");
}
function doLogin(email, pass){
  const u = db.users.find(x=>x.email.toLowerCase()===email.toLowerCase() && x.password===pass);
  if(!u) return false;
  db.currentUserEmail = u.email;
  persist();
  return true;
}
function doCadastro(name, email, pass){
  db.users.push({name, email, password:pass, handle: email.split("@")[0], avatar:"emblem"});
  db.currentUserEmail = email;
  persist();
}
const AVATAR_OPTIONS = ["emblem","fogo","agua","eletrico","psiquico","dragao","fada","normal"];
function avatarGlyph(key, size){
  const s = size || 34;
  if(key === "emblem"){
    return `<svg width="${s}" height="${s}" viewBox="0 0 32 32"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="var(--teal)" stroke-width="1.6"/><polygon points="16,10 22,13.5 22,20.5 16,24 10,20.5 10,13.5" fill="#1A2233" stroke="var(--red)" stroke-width="1.4"/><circle cx="16" cy="17" r="2.6" fill="var(--yellow)"/></svg>`;
  }
  const c = (TYPE_COLORS[key]||TYPE_COLORS.normal).fill;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}">${typeGlyphPath(key)}</svg>`;
}
function doSetAvatar(key){
  const u = currentUser();
  if(!u) return;
  u.avatar = key;
  persist();
}
function doPublishCard(){
  const d = state.publishData;
  const u = currentUser();
  if(!u) return null;
  const avail = (d.venda && d.troca) ? "ambos" : (d.venda ? "venda" : "troca");
  const newCard = {
    id: Date.now(),
    name: d.name, hp: 200 + Math.floor(Math.random()*150), type: d.type || "normal",
    rarity: 1 + Math.floor(Math.random()*3), edition: d.edition, num: "USR/"+String(Date.now()).slice(-3),
    condCode: d.cond || "quasenova", avail,
    price: d.venda ? Number(d.price) : null,
    tradefor: d.troca ? d.tradefor : null,
    seller: u.handle, sellerName: u.name, rating: 1,
    imagem: d.imgFrente || "", imagemVerso: d.imgVerso || "", imagemFonte: d.imgFrente ? "Imagem enviada pelo colecionador" : "",
  };
  db.myCards.push(newCard);
  persist();
  return newCard;
}

/* =====================================================
   VALIDAÇÃO DE E-MAIL simples
===================================================== */
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

/* =====================================================
   DELEGAÇÃO GLOBAL DE EVENTOS
===================================================== */
document.addEventListener("click", (e)=>{
  const removeImgBtn = e.target.closest("[data-remove-img]");
  if(removeImgBtn){
    e.stopPropagation();
    const target = removeImgBtn.getAttribute("data-remove-img");
    if(target === "frente") state.publishData.imgFrente = null;
    else state.publishData.imgVerso = null;
    render();
    return;
  }
  // modal de autenticação
  if(e.target.id === "authmodal-cancel" || e.target.id === "auth-modal-overlay"){
    state.authPromptOpen = false;
    render();
    return;
  }
  if(e.target.id === "authmodal-login"){
    state.authPromptOpen = false;
    state.authMode = "login";
    go("login", {redirectAfterLogin: state.pendingAction});
    return;
  }
  if(e.target.id === "authmodal-signup"){
    state.authPromptOpen = false;
    state.authMode = "cadastro";
    go("login", {redirectAfterLogin: state.pendingAction});
    return;
  }
  // sino de notificações
  if(e.target.closest("#btn-open-avatar-picker")){
    state.showAvatarPicker = !state.showAvatarPicker;
    render();
    return;
  }
  const dpadBtn = e.target.closest("[data-dpad]");
  if(dpadBtn){
    const action = dpadBtn.getAttribute("data-dpad");
    const total = allCards().length;
    if(action === "prev") state.featuredIndex = (((state.featuredIndex||0) - 1) % total + total) % total;
    else if(action === "next") state.featuredIndex = (((state.featuredIndex||0) + 1) % total + total) % total;
    else if(action === "open"){
      const idx = ((state.featuredIndex||0) % total + total) % total;
      go("detalhe", {selectedCardId: allCards()[idx].id});
      return;
    }
    render();
    return;
  }
  const avatarOptBtn = e.target.closest("[data-set-avatar]");
  if(avatarOptBtn){
    doSetAvatar(avatarOptBtn.getAttribute("data-set-avatar"));
    state.showAvatarPicker = false;
    toast("Avatar atualizado", "success");
    render();
    return;
  }
  const chatTabBtn = e.target.closest("[data-chat-channel]");
  if(chatTabBtn){
    state.chatChannel = chatTabBtn.getAttribute("data-chat-channel");
    render();
    return;
  }
  if(e.target.id === "btn-chat-send"){
    const input = document.getElementById("chat-input");
    const text = input ? input.value : "";
    if(text.trim()){
      doSendChatMessage(state.chatChannel || "br", text);
      render();
      const win = document.getElementById("chat-window");
      if(win) win.scrollTop = win.scrollHeight;
    }
    return;
  }
  const bellEl = e.target.closest("#btn-notif-bell");
  if(bellEl){
    e.stopPropagation();
    state.showNotifPanel = !state.showNotifPanel;
    render();
    return;
  }
  const notifItemEl = e.target.closest("[data-notif]");
  if(notifItemEl){
    const nId = notifItemEl.getAttribute("data-notif");
    const n = db.notifications.find(x=>x.id===nId);
    if(n){ n.read = true; persist(); }
    state.showNotifPanel = false;
    render();
    return;
  }
  if(e.target.id === "btn-mark-all-read"){
    db.notifications.forEach(n=>n.read=true);
    persist();
    render();
    return;
  }
  // clique fora do painel de notificações fecha o painel
  if(state.showNotifPanel && !e.target.closest("#notif-panel")){
    state.showNotifPanel = false;
    render();
  }
  // navegação simples
  const navEl = e.target.closest("[data-nav]");
  if(navEl && !navEl.hasAttribute("data-requirelogin")){
    e.preventDefault();
    const v = navEl.getAttribute("data-nav");
    const presetEdition = navEl.getAttribute("data-preset-edition");
    if(presetEdition){ state.filters.edition = presetEdition; state.search=""; go("explorar"); return; }
    const ptab = navEl.getAttribute("data-ptab");
    if(v === "carrinho") go("carrinho");
    else if(v === "detalhe") go("detalhe");
    else if(v === "trocas") requireLogin("trocas", {});
    else if(v === "chat") requireLogin("chat", {});
    else if(v === "perfil") requireLogin("perfil", ptab?{profileTab:ptab}:{});
    else if(v === "publicar") requireLogin("publicar", {});
    else go(v);
    return;
  }
  // navegação que exige login
  const reqEl = e.target.closest("[data-requirelogin]");
  if(reqEl){
    e.preventDefault();
    requireLogin(reqEl.getAttribute("data-requirelogin"));
    return;
  }
  // favoritar
  const favEl = e.target.closest("[data-fav]");
  if(favEl){
    e.stopPropagation();
    if(!isLoggedIn()){ requireLogin(state.view, {selectedCardId: state.selectedCardId}); return; }
    doToggleFavorite(Number(favEl.getAttribute("data-fav")));
    render();
    return;
  }
  // cartas clicáveis
  const cardEl = e.target.closest(".cardface");
  if(cardEl && !cardEl.hasAttribute("data-nav")){
    const id = Number(cardEl.getAttribute("data-card"));
    if(cardEl.getAttribute("data-pickable")){
      if(state.tradeOffered.has(id)) state.tradeOffered.delete(id);
      else state.tradeOffered.add(id);
      render();
      return;
    }
    go("detalhe", {selectedCardId:id});
    return;
  }
  if(e.target.id === "btn-comprar"){
    if(!isLoggedIn()){ requireLogin("detalhe", {selectedCardId: state.selectedCardId}); return; }
    doAddToCart(state.selectedCardId);
    go("carrinho");
    return;
  }
  if(e.target.id === "btn-trocar"){
    if(!isLoggedIn()){ requireLogin("detalhe", {selectedCardId: state.selectedCardId}); return; }
    state.tradeOffered = new Set();
    go("troca", {tradeTargetId: state.selectedCardId});
    return;
  }
  if(e.target.id === "btn-revisar-troca"){ go("troca-revisao"); return; }
  if(e.target.id === "btn-enviar-troca"){
    doSendTrade();
    state.tradeOffered = new Set();
    toast("Proposta de troca enviada! Acompanhe em Minhas trocas.", "success");
    go("trocas");
    return;
  }
  if(e.target.id === "btn-calc-frete"){
    const cepInput = document.getElementById("cep-input");
    state.cepInput = cepInput ? cepInput.value : state.cepInput;
    if(!calcFrete(state.cepInput)){ toast("CEP inválido — digite os 8 dígitos.", "error"); }
    render();
    return;
  }
  if(e.target.id === "btn-checkout"){
    const ok = doCheckout();
    if(!ok){ toast("Calcule o frete antes de finalizar a compra.", "error"); return; }
    toast("Compra finalizada com sucesso!", "success");
    go("pedido", {lastOrderId: state.lastOrderId});
    return;
  }
  const viewOrderBtn = e.target.closest("[data-view-order]");
  if(viewOrderBtn){ go("pedido", {lastOrderId: viewOrderBtn.getAttribute("data-view-order")}); return; }
  if(e.target.id === "btn-advance-order"){
    doAdvanceOrder(e.target.getAttribute("data-order"));
    render();
    return;
  }
  if(e.target.id === "clear-filters" || e.target.id === "clear-filters-2"){
    state.filters = {type:"", avail:"", cond:"", edition:"", rarity:"", maxPrice:null};
    state.search = "";
    state.explorePage = 0;
    render();
    return;
  }
  const unfilterBtn = e.target.closest("[data-unfilter]");
  if(unfilterBtn){
    const k = unfilterBtn.getAttribute("data-unfilter");
    if(k==="search") state.search = "";
    else if(k==="maxPrice") state.filters.maxPrice = null;
    else state.filters[k] = "";
    state.explorePage = 0;
    render();
    return;
  }
  const pageDpadBtn = e.target.closest("[data-page-dpad]");
  if(pageDpadBtn){
    const action = pageDpadBtn.getAttribute("data-page-dpad");
    if(action === "top"){ window.scrollTo(0,0); return; }
    // recalcula total de páginas com os filtros atuais
    const f = state.filters;
    const pr = priceRange();
    const maxPrice = f.maxPrice || pr.max;
    const q = state.search.trim().toLowerCase();
    const count = allCards().filter(c=>{
      const matchesText = !q || c.name.toLowerCase().includes(q) || (c.pokemon||"").toLowerCase().includes(q) || (c.edition||"").toLowerCase().includes(q);
      const matchesType = !f.type || c.type===f.type;
      const matchesAvail = !f.avail || c.avail===f.avail || c.avail==="ambos";
      const matchesCond = !f.cond || c.condCode===f.cond;
      const matchesEdition = !f.edition || c.edition===f.edition;
      const matchesRarity = !f.rarity || String(c.rarity)===String(f.rarity);
      const matchesPrice = !c.price || c.price<=maxPrice;
      return matchesText && matchesType && matchesAvail && matchesCond && matchesEdition && matchesRarity && matchesPrice;
    }).length;
    const totalPages = Math.max(1, Math.ceil(count / EXPLORE_PAGE_SIZE));
    const cur = Math.min(state.explorePage||0, totalPages-1);
    if(action === "first") state.explorePage = 0;
    else if(action === "last") state.explorePage = totalPages-1;
    else if(action === "prev") state.explorePage = (cur - 1 + totalPages) % totalPages;
    else if(action === "next") state.explorePage = (cur + 1) % totalPages;
    render();
    window.scrollTo(0,0);
    return;
  }
  // troca — aceitar/recusar/contraproposta
  const tradeActionBtn = e.target.closest("[data-trade-action]");
  if(tradeActionBtn){
    const action = tradeActionBtn.getAttribute("data-trade-action");
    const tradeId = tradeActionBtn.getAttribute("data-trade");
    if(action==="contraproposta"){
      state.tradeOffered = new Set();
      go("contraproposta", {counterTradeId: tradeId});
    } else {
      doTradeAction(tradeId, action);
      render();
    }
    return;
  }
  if(e.target.id === "btn-enviar-contraproposta"){
    const tradeId = e.target.getAttribute("data-trade");
    doSendCounter(tradeId);
    state.tradeOffered = new Set();
    toast("Contraproposta enviada!", "success");
    go("trocas");
    return;
  }
  // login / cadastro / recuperação
  const authModeBtn = e.target.closest("[data-authmode]");
  if(authModeBtn){
    state.authMode = authModeBtn.getAttribute("data-authmode");
    state._loginErr = false; state._cadErr = null; state._recSent = false; state._cadForm = {};
    render();
    return;
  }
  if(e.target.id === "btn-login"){
    const email = document.getElementById("login-email").value.trim();
    const pass = document.getElementById("login-pass").value;
    if(doLogin(email, pass)){
      toast(`Bem-vindo(a) de volta, ${currentUser().name.split(" ")[0]}!`, "success");
      const redirect = state.redirectAfterLogin;
      state.redirectAfterLogin = null;
      state._loginErr = false;
      if(redirect) go(redirect.view, redirect.params);
      else go("perfil");
    } else {
      state._loginErr = true;
      state._loginEmail = email;
      render();
    }
    return;
  }
  if(e.target.id === "btn-cadastro"){
    const name = document.getElementById("cad-name").value.trim();
    const email = document.getElementById("cad-email").value.trim();
    const pass = document.getElementById("cad-pass").value;
    const confirm = document.getElementById("cad-confirm").value;
    state._cadForm = {name, email};
    if(!name){ state._cadErr="name"; render(); return; }
    if(!isValidEmail(email)){ state._cadErr="email"; state._cadErrMsg="Informe um e-mail válido."; render(); return; }
    if(db.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){ state._cadErr="email"; state._cadErrMsg="Este e-mail já está cadastrado."; render(); return; }
    if(pass.length<6){ state._cadErr="pass"; render(); return; }
    if(pass!==confirm){ state._cadErr="confirm"; render(); return; }
    doCadastro(name, email, pass);
    state._cadErr = null;
    state._cadForm = {};
    toast(`Conta criada com sucesso! Bem-vindo(a), ${name.split(" ")[0]}.`, "success");
    go("perfil");
    return;
  }
  if(e.target.id === "btn-recuperar"){
    const email = document.getElementById("rec-email").value.trim();
    if(!isValidEmail(email)){ toast("Informe um e-mail válido.", "error"); return; }
    state._recSent = true;
    state._recEmail = email;
    render();
    return;
  }
  if(e.target.id === "btn-logout"){
    db.currentUserEmail = null;
    persist();
    toast("Você saiu da sua conta.");
    go("home");
    return;
  }
  // qty controls do carrinho
  const qtyBtn = e.target.closest("[data-qty]");
  if(qtyBtn){
    const id = Number(qtyBtn.getAttribute("data-id"));
    const action = qtyBtn.getAttribute("data-qty");
    const item = db.cart.find(i=>i.id===id);
    if(action==="inc" && item) item.qty++;
    if(action==="dec" && item){ item.qty--; if(item.qty<=0) db.cart = db.cart.filter(i=>i.id!==id); }
    if(action==="remove") db.cart = db.cart.filter(i=>i.id!==id);
    persist();
    render();
    return;
  }
  // profile tabs
  const ptab = e.target.closest("[data-ptab]");
  if(ptab && state.view==="perfil"){ state.profileTab = ptab.getAttribute("data-ptab"); render(); return; }
  // admin tabs
  const atab = e.target.closest("[data-atab]");
  if(atab){ state.adminTab = atab.getAttribute("data-atab"); render(); return; }

  // publicar — navegação de passos com validação real
  if(e.target.id === "pub-next-1"){
    const name = document.getElementById("p-name").value.trim();
    const edition = document.getElementById("p-edition").value.trim();
    const type = document.getElementById("p-type").value;
    const condEl = document.querySelector('input[name="p-cond"]:checked');
    let hasError = false;
    state.publishData = {...state.publishData, name, edition, type, cond: condEl?condEl.value:"quasenova"};
    if(!name){ state.publishData._errName = true; hasError = true; } else state.publishData._errName = false;
    if(!edition){ state.publishData._errEdition = true; hasError = true; } else state.publishData._errEdition = false;
    if(hasError){ render(); return; }
    state.publishStep = 2;
    render();
    return;
  }
  if(e.target.id === "pub-back-2"){ state.publishStep = 1; render(); return; }
  if(e.target.id === "pub-next-2"){
    const venda = document.getElementById("p-venda").checked;
    const troca = document.getElementById("p-troca").checked;
    const price = document.getElementById("p-price").value;
    const tradefor = document.getElementById("p-tradefor").value.trim();
    state.publishData = {...state.publishData, venda, troca, price, tradefor};
    let hasError = false;
    if(!venda && !troca){ state.publishData._errAvail = true; hasError = true; } else state.publishData._errAvail = false;
    if(venda && (!price || Number(price)<=0)){ state.publishData._errPrice = true; hasError = true; } else state.publishData._errPrice = false;
    if(troca && !tradefor){ state.publishData._errTradefor = true; hasError = true; } else state.publishData._errTradefor = false;
    if(hasError){ render(); return; }
    state.publishStep = 3;
    render();
    return;
  }
  if(e.target.id === "pub-back-3"){ state.publishStep = 2; render(); return; }
  if(e.target.id === "pub-finish"){
    const newCard = doPublishCard();
    if(!newCard){ requireLogin("publicar", {}); return; }
    toast(`"${newCard.name}" publicada com sucesso! Ela já está no seu perfil.`, "success");
    state.publishData = {};
    state.publishStep = 1;
    go("perfil", {profileTab: newCard.avail==='troca'?'troca':'venda'});
    return;
  }
});

/* inicialização */
if(!isLoggedIn()){
  // mantém navegação livre, mas garante estado consistente
}
render();
</script>
